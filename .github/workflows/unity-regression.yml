name: Unity QA Automation Regression Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  run-regression-tests:
    runs-on: self-hosted
    
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4
        with:
          clean: false

      # 32번째 줄 주변의 들여쓰기와 명령어 구조를 공인 표준 규격으로 완벽히 정정했습니다
      - name: Execute Unity QA Master Pipeline
        run: |
          cd /d D:\funity\Test1
          call alt-tests\run_alt_ci_pipeline.bat
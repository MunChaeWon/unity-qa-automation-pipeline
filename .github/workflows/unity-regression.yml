name: Unity QA Automation Regression Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  run-regression-tests:
    runs-on: self-hosted
    
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Execute Unity QA Master Pipeline
        shell: cmd
        # 주군의 alt-tests 폴더 안에 있는 진짜 구글/슬랙 파이프라인 배치 파일명을 정확히 지목합니다!
        run: |
          cd /d D:\funity\Test1
          call D:\funity\Test1\alt-tests\run_alt_google_slack_pipeline.bat
name: Unity QA Automation Regression Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write
  pull-requests: write

jobs:
  run-regression-tests:
    runs-on: self-hosted
    
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v3
        with:
          clean: true
          submodules: false
          persist-credentials: false

      - name: Execute Unity QA Master Pipeline
        shell: cmd
        run: |
          cd /d D:\funity\Test1
          call D:\funity\Test1\alt-tests\run_github_actions_pipeline.bat

      - name: Cleanup git submodule config
        if: always()
        shell: cmd
        run: |
          cd /d D:\actions-runner\_work\unity-qa-automation-pipeline\unity-qa-automation-pipeline
          git config --local --remove-section submodule 2>nul || exit 0
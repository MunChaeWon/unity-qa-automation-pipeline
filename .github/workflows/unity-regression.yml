name: Unity QA Automation Regression Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  run-regression-tests:
    runs-on: self-hosted
    
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Execute Unity QA Master Pipeline
        shell: cmd
        # 새로 만든 무인 자동화 전용 배치 파일을 조준하도록 정밀 타격 설정을 변경했습니다
        run: |
          cd /d D:\funity\Test1
          call D:\funity\Test1\alt-tests\run_github_actions_pipeline.bat
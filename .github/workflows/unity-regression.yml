name: Unity QA Automation Regression Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# 2026년 깃허브 정책에 맞추어 Node.js 24 환경을 강제로 선언하여 경고를 잠재웁니다
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  run-regression-tests:
    runs-on: self-hosted
    
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4
        with:
          clean: false

      # 에러가 발생하더라도 구체적으로 어디서 터졌는지 추적하기 위해 환경을 정비합니다
      - name: Execute Unity QA Master Pipeline
        run: |
          cd /d D:\funity\Test1
          call alt-tests\run_alt_ci_pipeline.bat